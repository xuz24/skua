name: Validate Skua

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Ensure both supported shells (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Install pinned development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install source package
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Check dependencies
        run: python -m pip check
      - name: Run behavioral and end-to-end tests
        run: python -m pytest -q
      - name: Verify a fresh pinned wheel installation
        run: python scripts/verify_install.py
