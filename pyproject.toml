[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "skua"
version = "1.0.0"
description = "A lightweight terminal coding harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "prompt-toolkit>=3.0,<4",
  "rich>=13,<15",
  "tomlkit>=0.13,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pip-tools>=7,<8"]

[project.scripts]
skua = "skua.cli:main"

[tool.setuptools.packages.find]
include = ["skua*"]

[tool.setuptools.package-data]
skua = ["assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
