[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skua-harbor"
version = "0.1.0"
description = "Optional pinned Harbor adapter for Skua"
requires-python = ">=3.12"
dependencies = ["harbor==0.25.0"]

[tool.setuptools.packages.find]
include = ["skua_harbor*"]
