schema_version = "1.4"

[metadata]
description = "Offline-provider Skua/Harbor integration fixture"

[agent]
timeout_sec = 150

[verifier]
timeout_sec = 30

[environment]
build_timeout_sec = 600
cpus = 1
memory_mb = 1024

[environment.healthcheck]
command = "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health')\""
interval_sec = 1
timeout_sec = 2
retries = 30
